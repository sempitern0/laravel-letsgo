networks:
  laravel-app-network:
    driver: bridge

x-services-volume: &services-volume
  type: bind
  source: ./${APPLICATION_FOLDER}
  target: /var/www

services:
  laravel_app:
    # env_file: docker.env
    build:
      args:
        - USER=${USER:-laravel_user}
        - USER_UID=${USER_UID:-1000} # workspaces images are designed to run as the unprivileged user - hence the UID 1000.
        - USER_GID=${USER_GID:-1000}
        - APPLICATION_FOLDER=${APPLICATION_FOLDER:-src}
      context: .
      dockerfile: Dockerfile
    image: ${LARAVEL_IMAGE_NAME:-laravel_app_image}
    container_name: ${LARAVEL_CONTAINER_NAME:-laravel_app}
    working_dir: /var/www # Working directory defined on the Dockerfile
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    volumes:
      - <<: *services-volume
      - ./images/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./images/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    networks:
      - laravel-app-network

  laravel_webserver:
    platform: linux/amd64
    image: nginx:alpine
    container_name: laravel_webserver_container
    volumes:
      - <<: *services-volume
      - ./images/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Read-only
    ports:
      - "8085:80"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - laravel-app-network

  mysql_db:
    platform: linux/amd64
    image: mysql:9.6
    container_name: laravel_mysql
    tty: true
    ports:
      - "3337:3306"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_USER_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "${DB_ALLOW_EMPTY_PASSWORD}"
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_USER_PASSWORD}"]
      retries: 3
      timeout: 10s
      interval: 30s
    networks:
      - laravel-app-network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
