networks:
  laravel-app-network:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-services-volume: &services-volume
  type: bind
  source: ./${APPLICATION_FOLDER}
  target: /var/www

services:
  laravel_app:
    profiles: ["laravel"]
    # env_file: docker.env
    build:
      args:
        - USER=${USER:-laravel_user}
        - USER_UID=${USER_UID:-1000} # workspaces images are designed to run as the unprivileged user - hence the UID 1000.
        - USER_GID=${USER_GID:-1000}
        - APPLICATION_FOLDER=${APPLICATION_FOLDER:-src}
      context: .
      dockerfile: Dockerfile
    image: "${CONTAINER_PREFIX:-app}_laravel_app_image"
    container_name: "${CONTAINER_PREFIX:-app}_laravel"
    working_dir: /var/www # Working directory defined on the Dockerfile
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    volumes:
      - <<: *services-volume
      - ./images/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./images/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
      - tinker_history:/home/${USER}/.config/psysh
    depends_on:
      mysql_db:
        condition: service_started
        required: false
      postgres_db:
        condition: service_started
        required: false
    networks:
      - laravel-app-network

  queue_worker:
    profiles: ["laravel"]
    image: "${CONTAINER_PREFIX:-app}_laravel_app_image"
    container_name: "${CONTAINER_PREFIX:-app}_queue_container"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    working_dir: /var/www
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    stop_signal: SIGTERM # SIGTERM as the stop signal for graceful shutdown (especially for fpm-apache and fpm-nginx)
    volumes:
      - <<: *services-volume
      - ./images/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - laravel_app
      - redis
    networks:
      - laravel-app-network

  scheduler:
    profiles: ["laravel"]
    image: "${CONTAINER_PREFIX:-app}_laravel_app_image"
    container_name: "${CONTAINER_PREFIX:-app}_scheduler_container"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    working_dir: /var/www
    command: php artisan schedule:work
    stop_signal: SIGTERM # SIGTERM as the stop signal for graceful shutdown (especially for fpm-apache and fpm-nginx)
    volumes:
      - <<: *services-volume
      - ./images/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - laravel_app
    networks:
      - laravel-app-network

  webserver:
    profiles: ["laravel"]
    platform: linux/amd64
    image: nginx:alpine
    container_name: "${CONTAINER_PREFIX:-app}_webserver_container"
    volumes:
      - <<: *services-volume
      - ./images/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Read-only
    ports:
      - 8085:80
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - laravel_app
    networks:
      - laravel-app-network

  proxy_https:
    profiles: ["laravel"]
    platform: linux/amd64
    image: nginx:alpine
    container_name: "${CONTAINER_PREFIX:-app}_proxy_https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./images/nginx/certs:/etc/nginx/certs:ro
      - ./images/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webserver
    networks:
      - laravel-app-network

  mysql_db:
    profiles: ["mysql"]
    platform: linux/amd64
    image: mysql:9.6
    container_name: "${CONTAINER_PREFIX:-app}_mysql"
    tty: true
    ports:
      - 3337:3306
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_USER_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "${DB_ALLOW_EMPTY_PASSWORD}"
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./images/database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      # Passing the password via CLI may trigger a security warning in logs
      test: ["CMD", "mysqladmin", "ping", "-p${DB_USER_PASSWORD}"]
      retries: 3
      timeout: 10s
      interval: 30s
    networks:
      - laravel-app-network

  phpmyadmin:
    profiles: ["mysql"]
    image: phpmyadmin:5.2.3-apache
    container_name: "${CONTAINER_PREFIX:-app}_phpmyadmin"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_USER: "${DB_USER}"
      PMA_PASSWORD: "${DB_USER_PASSWORD}"
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 1G
      HIDE_PHP_VERSION: true
    ports:
      - "8383:80"
    depends_on:
      - mysql_db
    networks:
      - laravel-app-network

  postgres_db:
    profiles: ["postgres"]
    image: postgres:18.2
    container_name: "${CONTAINER_PREFIX:-app}_postgres"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_USER_PASSWORD}"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel-app-network

  pgadmin:
    profiles: ["postgres"]
    container_name: "${CONTAINER_PREFIX:-app}_pgadmin"
    image: elestio/pgadmin:latest
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    ports:
      - "8080:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${DB_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${DB_USER_PASSWORD}"
      PGADMIN_LISTEN_PORT: 8080
    depends_on:
      - postgres_db
    networks:
      - laravel-app-network

  redis:
    image: redis:8.6.0
    container_name: "${CONTAINER_PREFIX:-app}_redis"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    logging: *default-logging
    ports:
      - 7379:6379
    command: >
      redis-server 
      --requirepass "${REDIS_PASSWORD:-secret}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - laravel-app-network

  redis_insight:
    image: redis/redisinsight:latest
    container_name: "${CONTAINER_PREFIX:-app}_redis_insight"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    ports:
      - 5540:5540
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
    networks:
      - laravel-app-network

  mailpit:
    profiles: ["laravel"]
    image: axllent/mailpit:latest
    container_name: "${CONTAINER_PREFIX:-app}_mailpit"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    networks:
      - laravel-app-network

volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redis_insight_data:
    driver: local
  mailpit_data:
    driver: local
  tinker_history:
    driver: local
