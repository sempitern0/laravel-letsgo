networks:
  laravel-app-network:
    driver: bridge

services:
  laravel_app:
    env_file: "docker.env"
    build:
      args:
        - USER=${USER:-laravel_user}
        - USER_UID=${USER_UID:-1000} # workspaces images are designed to run as the unprivileged user - hence the UID 1000.
        - USER_GID=${USER_GID:-1000}
      context: .
      dockerfile: Dockerfile
    image: ${LARAVEL_IMAGE_NAME:-laravel_app_image}
    container_name: ${LARAVEL_CONTAINER_NAME:-laravel_app}
    working_dir: /var/www # Working directory defined on the Dockerfile
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    volumes:
      - ./:/var/www
      - ./images/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini:ro
    networks:
      - laravel-app-network

  laravel_webserver:
    platform: linux/amd64
    image: nginx:alpine
    container_name: laravel_webserver_container
    volumes:
      - ./images/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro # Read-only
    ports:
      - "8085:80"
    restart: "${DOCKER_RESTART_POLICY:-unless-stopped}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - laravel-app-network

